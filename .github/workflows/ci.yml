name: Build + link check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run link/image checker (fails build on broken links)
        run: python3 check_links.py --quiet

      - name: Build site to dist/
        run: python3 build.py

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy-netlify:
    # Deploys to Netlify only if NETLIFY_SITE_ID + NETLIFY_AUTH_TOKEN secrets
    # are configured (see README "Deploy to Netlify"). Otherwise skips.
    needs: check-and-build
    if: env.NETLIFY_SITE_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --prod --dir=dist --site=${{ env.NETLIFY_SITE_ID }}
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
