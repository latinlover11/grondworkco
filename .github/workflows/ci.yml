name: Build + link check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run link/image checker (fails build on broken links)
        run: python3 check_links.py --quiet

      - name: Build site to dist/
        run: python3 build.py

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy-netlify:
    # Deploys to Netlify only when pushed to main AND the Netlify secrets
    # are configured (README: "Deploy to Netlify"). If secrets are missing,
    # the check step fails loudly instead of deploying to the wrong site.
    needs: check-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Fail if Netlify secrets are not configured
        run: |
          if [ -z "$NETLIFY_SITE_ID" ] || [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "Netlify credentials not configured for this workflow."
            echo "Configure NETLIFY_SITE_ID and NETLIFY_AUTH_TOKEN secrets in repo settings,"
            echo "or deploy manually with: ntl deploy --prod"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --prod --dir=dist --site=${{ env.NETLIFY_SITE_ID }}
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
