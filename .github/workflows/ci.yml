# Verify links and build dist/ on every push and pull request.
#
# Deployment does not happen here on purpose. The site is Git-connected on
# Netlify (the API reports `build_settings.provider: github`, installation
# 81663554), so Netlify builds and publishes it itself on every push to main.
# CI therefore stops at the built artifact: exactly one publisher, no race.
#
# Proven, not assumed — with the deploy step set to `if: false` and a marker in
# 404.html, CI run 43528505509 skipped its deploy while production served the
# marker, so Netlify published it (commits 6e1a9a6, reverted by ead1517).
#
# There used to be a deploy-netlify job running netlify/actions/cli behind a
# guard that exited 1 when NETLIFY_SITE_ID / NETLIFY_AUTH_TOKEN were unset. Those
# secrets were never created, so every push to main failed the whole workflow
# without deploying anything. Both that job and the zip deploy that replaced it
# are gone now; Netlify's git build is the only path.
name: Build and link check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run link/image checker (fails build on broken links)
        run: python3 check_links.py --quiet

      - name: Build site to dist/
        run: python3 build.py

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
