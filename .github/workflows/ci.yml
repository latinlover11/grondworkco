# Verify links and build dist/ on every push and pull request.
#
# Deployment does not happen here on purpose. Production is Cloudflare Pages
# (project `waxwing`), published by a manual direct upload from the machine that
# built dist/ - `python3 docs/deploy-pages.py --apply` - not by a host rebuilding
# this commit. CI therefore stops at the built artifact: exactly one publisher,
# so two builds of the same commit can never race to say which one is live.
#
# A green run here means the commit is sound. It says nothing about what
# production is serving; deploy after merging if the change matters.
#
# History, kept so this is not re-litigated: a deploy-netlify job once ran
# netlify/actions/cli behind a guard that exited 1 when NETLIFY_SITE_ID /
# NETLIFY_AUTH_TOKEN were unset. Those secrets were never created, so every push
# to main failed the whole workflow without deploying anything. When the job was
# replaced by a zip deploy, that step was set to `if: false` with a marker in
# 404.html: CI run 43528505509 skipped its deploy and production still served the
# marker, which is how we learned the publish was coming from Netlify's own git
# build (commits 6e1a9a6, reverted by ead1517). Netlify publishes nothing now -
# the old host only 301s - so no deploy step belongs here.
name: Build and link check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run link/image checker (fails build on broken links)
        run: python3 check_links.py --quiet

      - name: Build site to dist/
        run: python3 build.py

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
