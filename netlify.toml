[build]
  publish = "dist"
  command = "python3 build.py"
  # Pin the interpreter: the build image's default python3 is older than the
  # 3.12 used in CI, and an unpinned build would run this code on whatever the
  # image happens to ship. Keeps deploys and `python3 build.py` identical.
  [build.environment]
    PYTHON_VERSION = "3.12"

# The old host keeps working for a year: every legacy URL 301s to the same path
# on the new domain, so any link, bookmark or index entry pointing at
# groundworkllc.netlify.app lands on the right page. The rule is scoped to the
# netlify.app host on purpose — a bare "/*" here would redirect the new domain
# to itself and loop.
[[redirects]]
  from = "https://groundworkllc.netlify.app/*"
  to = "https://waxwinglandscaping.com/:splat"
  status = 301
  force = true

# Static assets are content-hashed by filename pattern (e.g. *-800.webp) or
# change only on deploy, so returning visitors can cache them hard. HTML
# always revalidates so deploys propagate immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/site.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/site.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts carry the same ?v=<sha256[:8]> token as site.css (injected into the
# minified @font-face URLs and the FONT_TAGS preloads by build.py), so the URL
# changes when the file does and immutable is safe here.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Basic security hardening, applied site-wide.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
